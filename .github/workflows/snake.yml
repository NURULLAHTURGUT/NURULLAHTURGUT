name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"   
  workflow_dispatch:       

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#58A6FF&color_dots=#ebedf0,#c6dbff,#8fb8ff,#58A6FF,#1f6feb
            dist/snake-dark.svg?palette=github-dark&color_snake=#58A6FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
